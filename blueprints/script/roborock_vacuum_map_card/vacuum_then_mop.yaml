blueprint:
  name: 'Roborock Vacuum Map Card: Vac followed by Mop'
  description: |-
    Vacuum selected HA areas, return to the dock, then mop the same areas.

    Fallback for floors without a native Roborock Vac followed by Mop routine. Select the created script as entities.vacuum_then_mop_script in the card.
  domain: script
  author: domidyon
  homeassistant:
    min_version: 2026.8.0
  source_url: >-
    https://github.com/domidyon/roborock-vacuum-map-card/blob/beta/blueprints/script/roborock_vacuum_map_card/vacuum_then_mop.yaml
  input:
    cleaning_mode:
      name: Cleaning mode
      description: The Roborock 'Cleaning mode' select (vacuum / vac_and_mop / mop).
      selector:
        entity:
          filter:
          - domain: select
            integration: roborock
    mop_intensity:
      name: Water flow
      description: The Roborock 'Mop intensity' select.
      selector:
        entity:
          filter:
          - domain: select
            integration: roborock
    mop_mode:
      name: Mop route
      description: The Roborock 'Mop mode' select.
      selector:
        entity:
          filter:
          - domain: select
            integration: roborock
    status_sensor:
      name: Status sensor
      description: The Roborock 'Status' sensor.
      selector:
        entity:
          filter:
          - domain: sensor
            integration: roborock
    vacuum:
      name: Roborock vacuum
      description: The vacuum the card controls.
      selector:
        entity:
          filter:
          - domain: vacuum
            integration: roborock
icon: mdi:vacuum-outline
mode: single
fields:
  cleaning_area_id:
    name: Cleaning areas
    required: true
    selector:
      area:
        multiple: true
  fan_speed:
    name: Suction power
    required: true
    default: balanced
    selector:
      select:
        options:
        - quiet
        - balanced
        - turbo
        - max
  mop_mode:
    name: Route
    required: true
    default: standard
    selector:
      select:
        options:
        - fast
        - standard
        - deep
  mop_intensity:
    name: Water flow
    required: true
    default: medium
    selector:
      select:
        options:
        - slight
        - low
        - medium
        - moderate
        - high
        - extreme
sequence:
- alias: Select vacuum-only cleaning
  action: select.select_option
  target:
    entity_id: !input cleaning_mode
  data:
    option: vacuum
- alias: Leave SmartPlan route before setting a manual route
  if:
  - condition: state
    entity_id: !input mop_mode
    state: smart_mode
  then:
  - action: select.select_option
    target:
      entity_id: !input mop_mode
    data:
      option: custom
- alias: Set vacuum route
  action: select.select_option
  target:
    entity_id: !input mop_mode
  data:
    option: "{{ mop_mode }}"
- alias: Set suction power
  action: vacuum.set_fan_speed
  target:
    entity_id: !input vacuum
  data:
    fan_speed: "{{ fan_speed }}"
- alias: Set one vacuum pass
  action: vacuum.send_command
  target:
    entity_id: !input vacuum
  data:
    command: set_clean_repeat_times
    params:
      repeat: 1
- alias: Start vacuum-only areas
  action: vacuum.clean_area
  target:
    entity_id: !input vacuum
  data:
    cleaning_area_id: "{{ cleaning_area_id }}"
- alias: Wait for vacuum phase to start if needed
  if:
  - condition: not
    conditions:
    - condition: state
      entity_id: !input vacuum
      state: cleaning
  then:
  - wait_for_trigger:
    - trigger: state
      entity_id: !input vacuum
      to: cleaning
    - trigger: state
      entity_id: !input status_sensor
      to: segment_cleaning
    timeout: '00:02:00'
    continue_on_timeout: false
- alias: Wait for vacuum phase to finish
  wait_for_trigger:
  - trigger: state
    entity_id: !input vacuum
    to: returning
  - trigger: state
    entity_id: !input vacuum
    to: docked
  - trigger: state
    entity_id: !input status_sensor
    to: returning_home
  - trigger: state
    entity_id: !input status_sensor
    to: charging
  timeout: '03:00:00'
  continue_on_timeout: false
- alias: Wait for the robot to return if needed
  if:
  - condition: not
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: !input status_sensor
        state: charging
      - condition: state
        entity_id: !input vacuum
        state: docked
  then:
  - wait_for_trigger:
    - trigger: state
      entity_id: !input status_sensor
      to: charging
    - trigger: state
      entity_id: !input vacuum
      to: docked
    timeout: '00:10:00'
    continue_on_timeout: false
- alias: Select mop-only cleaning
  action: select.select_option
  target:
    entity_id: !input cleaning_mode
  data:
    option: mop
- alias: Set mop route
  action: select.select_option
  target:
    entity_id: !input mop_mode
  data:
    option: "{{ mop_mode }}"
- alias: Set water flow
  action: select.select_option
  target:
    entity_id: !input mop_intensity
  data:
    option: "{{ mop_intensity }}"
- alias: Set one mop pass
  action: vacuum.send_command
  target:
    entity_id: !input vacuum
  data:
    command: set_clean_repeat_times
    params:
      repeat: 1
- alias: Start mop-only areas
  action: vacuum.clean_area
  target:
    entity_id: !input vacuum
  data:
    cleaning_area_id: "{{ cleaning_area_id }}"
